<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج ولجنة الرأفة</title>
    <!-- رابط Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index2.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4 fw-bold text-primary">نظام إدارة نتائج الطلاب</h2>

    <div class="row g-4">
        <!-- قسم إدخال البيانات -->
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h5 class="mb-3 border-bottom pb-2">تسجيل بيانات طالب جديد</h5>
                
                
                <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

                <div class="mb-3">
                    <label class="form-label">اسم الطالب</label>
                    <input type="text" id="stName" class="form-control" placeholder="أدخل الاسم ثلاثي">
                </div>

                <div class="row">
                    <div class="col-4 mb-3">
                        <label class="form-label">المادة 1</label>
                        <input type="number" id="sub1" class="form-control" placeholder="0-100">
                    </div>
                    <div class="col-4 mb-3">
                        <label class="form-label">المادة 2</label>
                        <input type="number" id="sub2" class="form-control" placeholder="0-100">
                    </div>
                    <div class="col-4 mb-3">
                        <label class="form-label">المادة 3</label>
                        <input type="number" id="sub3" class="form-control" placeholder="0-100">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">نسبة الحضور (%)</label>
                    <input type="number" id="attendance" class="form-control" placeholder="مثال: 85">
                </div>

                <div class="d-grid gap-2">
                    <button id="addBtn" class="btn btn-primary">إضافة طالب</button>
                    <button id="mercyBtn" class="btn btn-warning text-dark fw-bold">تفعيل لجنة الرأفة</button>
                </div>
            </div>
        </div>

        <!-- قسم عرض النتائج والتقارير -->
        <div class="col-md-7">
            <!-- قائمة الطلاب -->
            <div class="card shadow-sm p-4 mb-4">
                <h5 class="mb-3 border-bottom pb-2">الطلاب المسجلون</h5>
                <div id="studentsContainer" class="list-group">
                    <p class="text-muted small">لم يتم إضافة طلاب بعد...</p>
                </div>
            </div>

            <!-- تقرير لجنة الرأفة -->
            <div class="card shadow-sm p-4 border-warning">
                <h5 class="mb-3 border-bottom pb-2 text-warning-emphasis">التقرير النهائي للجنة الرأفة</h5>
                <div id="reportBox">
                    <p class="text-muted small">اضغط على زر "تفعيل لجنة الرأفة" لعرض الإحصائيات.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="index2.js"></script>
</body>
</html>
